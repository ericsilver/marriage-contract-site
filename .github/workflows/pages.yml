# Build and deploy marriagecontract.org. Copied into the site repo as .github/workflows/pages.yml
# by the book repo's build_site.py. Runs on every push and every morning, so a scheduled article
# goes live on its date without anyone pushing anything.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"      # 07:17 in New York (EDT); 06:17 in winter
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python publish.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
